[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbyg-scalper"
version = "0.3.0"
description = "BBYG tick-level adaptive scalper research and DEMO execution system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
gym = ["gymnasium>=1.0,<2"]
mt5 = ["MetaTrader5>=5.0,<6; sys_platform == 'win32'"]

[project.scripts]
truetrade = "truetrade.main:main"
babayaga-mt5-agent = "truetrade.execution.agent:main"
babayaga-mt5-worker = "truetrade.worker.mt5:main"
bbyg-demo = "scripts.bbyg_demo:main"

[tool.setuptools.packages.find]
include = ["truetrade*", "scripts*"]
